# ==============================================================================
# Dockge Compose Stack: fund-portfolio
# Personal Multi-Asset Portfolio Tracker (Thai Mutual Funds & US Stocks)
# Production Homelab Deployment with Cloudflare Tunnel (Zero Trust) Ingress
# ==============================================================================

services:
  backend:
    image: ghcr.io/noraseth-swu/fund-portfolio-backend:latest
    container_name: fund-portfolio-backend
    restart: unless-stopped
    environment:
      - SERVER_PORT=8088
      - DATABASE_URL=sqlite:/app/data/portfolio.db
      - SEC_API_KEY=${SEC_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - SENTRY_DSN=${SENTRY_DSN:-}
      - SENTRY_ENVIRONMENT=${SENTRY_ENVIRONMENT:-production}
      - DAILY_NAV_SYNC_ENABLED=${DAILY_NAV_SYNC_ENABLED:-true}
      - DAILY_NAV_SYNC_HOUR=${DAILY_NAV_SYNC_HOUR:-20}
      - DAILY_NAV_SYNC_MINUTE=${DAILY_NAV_SYNC_MINUTE:-30}
      - STATEMENT_DEFAULT_PASSWORD=${STATEMENT_DEFAULT_PASSWORD:-}
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8088/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  web:
    image: ghcr.io/noraseth-swu/fund-portfolio-web:latest
    container_name: fund-portfolio-web
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${LOCAL_WEB_PORT:-8095}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
