[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
base64 = "0.23.1"
chrono = { version = "0.4.45", features = ["serde"] }
dotenvy = "0.15.7"
reqwest = { version = "0.13.5", features = ["json", "query"] }
rust_decimal = { version = "1.43.0", features = ["serde-with-str"] }
sentry = { version = "0.49.6", features = ["backtrace", "contexts", "panic", "transport", "reqwest", "rustls", "tracing"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10.9"
sqlx = { version = "0.9.0", features = ["sqlite", "runtime-tokio", "chrono", "rust_decimal"] }
tokio = { version = "1.54.1", features = ["full"] }
tower-http = { version = "0.7.1", features = ["cors", "fs", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.29.2", features = ["v4", "serde"] }

[dev-dependencies]
rust_decimal_macros = "1.40.0"
